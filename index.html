<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Carousel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf9f7;
    }

    /* ===== TITLE ===== */
    .carousel-title {
      text-align: center;
      font-size: 24px;
      font-weight: 400;
      margin: 30px 0 20px;
      color: #2c2c2c;
    }

    /* ===== TRACK ===== */
    .carousel-track {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 0 16px 30px;
      -webkit-overflow-scrolling: touch;
    }

    /* ===== SLIDE ===== */
    .slide {
      flex: 0 0 85%;
      scroll-snap-align: center;
    }

    /* ===== IMAGE ===== */
    .slide img {
      width: 100%;
      border-radius: 16px;
      display: block;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    /* hide scrollbar */
    .carousel-track::-webkit-scrollbar {
      display: none;
    }
  </style>

</head>

<body>

  <h2 class="carousel-title">See It In Real Life</h2>

  <div class="carousel-track">

    <div class="slide">
      <img src="https://res.cloudinary.com/dvnfuy27n/image/upload/v1775082818/1_p47kpv.jpg">
    </div>

    <div class="slide">
      <img src="https://res.cloudinary.com/dvnfuy27n/image/upload/v1775082820/2_aot3yr.jpg">
    </div>

    <div class="slide">
      <img src="https://res.cloudinary.com/dvnfuy27n/image/upload/v1775082823/3_ne1tl1.jpg">
    </div>

  </div>

</body>
</html>
